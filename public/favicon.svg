<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vidToAudioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / App Icon Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="5" y="5" width="54" height="54" rx="15" fill="none" stroke="url(#glowGrad)" stroke-width="1.5"/>

  <!-- Left: Stylized Video Play Glyph -->
  <path d="M20 22 L32 32 L20 42 Z" fill="url(#vidToAudioGrad)" filter="url(#shadow)"/>

  <!-- Right: Dynamic Audio Waveform Equalizer Bars -->
  <rect x="36" y="26" width="3.5" height="12" rx="1.75" fill="#2dd4bf"/>
  <rect x="42" y="20" width="3.5" height="24" rx="1.75" fill="#5eead4"/>
  <rect x="48" y="24" width="3.5" height="16" rx="1.75" fill="#14b8a6"/>
</svg>
